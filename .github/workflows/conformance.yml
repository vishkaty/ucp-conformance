name: conformance-selftest

# The "test suite for the test suite": on every push/PR, materialize the pinned
# upstream sources, bring up the official golden server, and run every self-validation
# gate (register quote-check, verdict gate, both version suites, the merchant reference
# gate, and mutation kill-rate). Red here means a change broke the suite's soundness.

on:
  push:
    # lane/** and lane-* are the working lane-branch conventions (lane-receiver,
    # lane-fuzz, lane/p0-*, lane/p1-*) — included so lane branches run the selftest
    # BEFORE they merge to main. Without this a red lane can reach main unseen
    # (the 08-04 incident); the paths filter below still applies to all of them.
    branches: [main, "feat/**", "fix/**", "lane/**", "lane-*"]
    # public/** is included because the `coverage` gate cross-checks the published
    # coverage.json and the site's advertised check counts against reality.
    # packaging/** is included because the bundle-drift step + package-agent gate validate it.
    #
    # KEEP IN STEP WITH `env.WATCHED_PATHS` BELOW, with ONE deliberate difference that
    # the gate conformance/ci/validate_conformance_workflow.py knows about: `action.yml`
    # appears HERE but NOT in WATCHED_PATHS. The two lists answer different questions.
    # This one is "does the workflow start at all", and it must include action.yml so a
    # push touching only the composite Action still runs the `action-selftest` job that
    # exercises it. WATCHED_PATHS is "can this change affect the self-test SUITE", and
    # the suite does not read action.yml, so listing it there would buy a 15-minute
    # irrelevant suite run. GitHub forbids expressions in `on.*.paths`, so this list has
    # to repeat the other one literally. Change one, change both, minus that one entry.
    paths:
      - "conformance/**"
      - "public/**"
      - "tests/**"
      - "functions/**"
      - "packaging/**"
      - "docs/**"
      - "ARCHITECTURE.md"
      - "DECISIONS.md"
      - "PRINCIPLES.md"
      - "README.md"
      - "WORKSTREAMS.md"
      - "action.yml"
      - ".github/workflows/conformance.yml"
  pull_request:
    # DELIBERATELY NO `paths:` FILTER — do not add one back.
    # Branch protection on main requires the check `selftest` in strict mode. A paths
    # filter here means a PR touching only root-level files matches nothing, so no run
    # starts, so the required check never appears, so the PR is blocked for ever.
    # Measured on PR #9. Opened 2026-09-24 on head b1546b09 (WORKSTREAMS.md only): 0
    # pull_request runs, no `selftest` context, unmergeable for 7 days with no failing
    # check to act on, and a manual workflow_dispatch (run #259) was the only way to make
    # the check exist. Head b9642a87 touched conformance/testbed/, which the filter DOES
    # match: 1 pull_request run (#260), green, merged.
    # Scope is decided INSIDE the `selftest` job instead (see its first step), so the
    # job always runs and always reports, and costs seconds when the change is
    # irrelevant. A job-level `if:` would NOT work: a skipped job reports no check.
    # conformance/ci/validate_conformance_workflow.py fails if this filter comes back.
  workflow_dispatch: {}
  schedule:
    # Weekly heartbeat (Mon 06:17 UTC): sources are pinned, so this catches
    # environmental rot (runner images, toolchains, cache decay) — keeps the
    # "regularly tested and verified" promise even in quiet weeks.
    - cron: "17 6 * * 1"

# ─────────────────────────────────────────────────────────────────────────────────────
# THE watched-path list: ONE definition, read by the `scope` step of the `selftest` job
# below to decide whether a pull request can affect the SUITE. The `push:` filter above
# repeats it literally only because GitHub allows no expressions there, and adds
# `action.yml`, which belongs to the workflow trigger but not to the suite.
# Format: one path per line, no spaces. A trailing "/" means that directory and
# everything under it; anything else is an exact file path.
#
# The root documents and docs/ are here because gates genuinely READ them, which is easy
# to miss: ARCHITECTURE.md, PRINCIPLES.md, DECISIONS.md, WORKSTREAMS.md and
# docs/archive/ROADMAP.md are opened by conformance/ci/validate_steward_docs.py (the
# docs-steward gate asserts presence, one row per closed decision, and a review stamp
# inside 90 days), and README.md plus four more docs/*.md are opened by
# conformance/ci/site_gates.py (the docclaims gate holds every advertised count in them
# to the live product value). A change to any of those can turn a gate red, so it must
# never be short-circuited. PR #9 was exactly such a change, to WORKSTREAMS.md.
# This is not a list to curate by hand: validate_conformance_workflow.py imports those
# two gates and fails if anything they read is left uncovered here, so a gate that adds
# a document reds this workflow until the document is listed. It also pins the push/
# watched drift and kill-tests every clause. Run it after any edit here.
# ─────────────────────────────────────────────────────────────────────────────────────
env:
  WATCHED_PATHS: |
    conformance/
    public/
    tests/
    functions/
    packaging/
    docs/
    ARCHITECTURE.md
    DECISIONS.md
    PRINCIPLES.md
    README.md
    WORKSTREAMS.md
    .github/workflows/conformance.yml

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # ── THE GATE DECISION ─────────────────────────────────────────────────────────
      # This job must ALWAYS run and ALWAYS report, because branch protection on main
      # requires the `selftest` context in strict mode; a filtered trigger (or a
      # job-level `if:`) produces no check at all and blocks the PR for ever. So the
      # job runs unconditionally, this first step decides whether the change can
      # possibly affect the suite, and EVERY later step is conditional on its verdict:
      # seconds when the change is irrelevant, the whole suite when it is not.
      # Non-pull_request events (push, schedule, workflow_dispatch) are never
      # short-circuited. On any doubt it fails SAFE to "relevant".
      # Keep IDENTICAL to the twin step in the other job; the path list itself lives in
      # exactly one place, `env.WATCHED_PATHS` at the top of this file.
      - name: "Scope: can this change affect the self-test suite?"
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          say()    { echo "$1"; printf '%s\n\n' "$1" >> "$GITHUB_STEP_SUMMARY"; }
          decide() { echo "relevant=$1" >> "$GITHUB_OUTPUT"; }

          if [ "${{ github.event_name }}" != "pull_request" ]; then
            decide true
            say "SCOPE: event '${{ github.event_name }}' is not a pull_request -> RELEVANT: the full self-test suite RUNS."
            exit 0
          fi

          # The WHOLE pull request, diffed from the MERGE BASE against its base branch —
          # which is exactly what this endpoint returns — and never just the tip commit,
          # so a PR of several commits is judged on everything it changes.
          if ! files="$(gh api --paginate \
                "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
                --jq '.[].filename')"; then
            echo "::warning::SCOPE: could not read this PR's changed files; failing safe."
            decide true
            say "SCOPE: changed-file list unavailable -> failing SAFE to RELEVANT: the full self-test suite RUNS."
            exit 0
          fi

          watched="$RUNNER_TEMP/scope_watched.txt"
          changed="$RUNNER_TEMP/scope_changed.txt"
          hits="$RUNNER_TEMP/scope_hits.txt"
          printf '%s\n' "$WATCHED_PATHS" | tr -d '[:blank:]' | grep -v '^$' > "$watched" || true
          printf '%s\n' "$files"                             | grep -v '^$' > "$changed" || true
          : > "$hits"

          while IFS= read -r f; do
            while IFS= read -r pat; do
              case "$pat" in
                */) case "$f" in "$pat"*) printf '%s\n' "$f" >> "$hits" ;; esac ;;
                *)  if [ "$f" = "$pat" ]; then printf '%s\n' "$f" >> "$hits"; fi ;;
              esac
            done < "$watched"
          done < "$changed"

          echo "Watched paths (env.WATCHED_PATHS, the single definition):"
          sed 's/^/  * /' "$watched"
          echo "Files changed by PR #${{ github.event.pull_request.number }} ($(grep -c '' "$changed") from the merge base):"
          sed 's/^/  - /' "$changed"

          if [ -s "$hits" ]; then
            decide true
            echo "Watched paths touched:"
            sort -u "$hits" | sed 's/^/  + /'
            say "SCOPE: RELEVANT -> the full self-test suite RUNS."
          else
            decide false
            say "SCOPE: NOT RELEVANT -> the self-test suite is SHORT-CIRCUITED. This green check asserts only that the change cannot affect the suite; no gate was executed."
          fi

      - uses: actions/checkout@v5
        if: steps.scope.outputs.relevant == 'true'

      - uses: actions/setup-python@v6
        if: steps.scope.outputs.relevant == 'true'
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        if: steps.scope.outputs.relevant == 'true'
        with:
          node-version: "22"

      - name: Install uv
        if: steps.scope.outputs.relevant == 'true'
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: false   # avoid the flaky cache-prune post-step (hangs then errors)

      - name: Set up Rust (for the ucp-schema oracle)
        if: steps.scope.outputs.relevant == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Install the third-party crypto oracle (for the jws-interop gate)
        if: steps.scope.outputs.relevant == 'true'
        run: python3 -m pip install cryptography

      - name: Install the independent schema referee (for the dual-oracle gate)
        if: steps.scope.outputs.relevant == 'true'
        # An INDEPENDENT Python jsonschema engine (Draft 2020-12) that cross-checks the
        # Rust ucp-schema oracle on every schema check; verdict divergence alarms. Draft
        # 2020-12 $id resolution needs jsonschema>=4.26 + referencing. If this install
        # fails, the dual-oracle gate auto-skips (exit 2) rather than falsely passing.
        run: python3 -m pip install "jsonschema>=4.26" referencing

      - name: Install the pinned AP2 reference SDK (for the sdjwt-vs-reference gate)
        if: steps.scope.outputs.relevant == 'true'
        # google-agentic-commerce/AP2 tracks a moving IETF draft, so we pin the exact
        # commit. The gate's reference-parity tier auto-skips if this install fails;
        # tier 1 (our independent codec on committed goldens) always runs.
        run: python3 -m pip install "git+https://github.com/google-agentic-commerce/AP2@e1ea56db72a6385bce3e5c1112b3a56ce60acb43" || echo "::warning::AP2 reference install failed — sdjwt-vs-reference runs tier 1 only"

      - name: Install web-test deps + headless Chromium (for the web-unit/web-browser gates)
        if: steps.scope.outputs.relevant == 'true'
        run: |
          cd tests/web && npm i --no-audit --no-fund
          npx @puppeteer/browsers install chrome-headless-shell@stable --path "$HOME/.cache/puppeteer" | tail -1
          echo "CHROME_PATH=$(ls $HOME/.cache/puppeteer/chrome-headless-shell/*/chrome-headless-shell-linux64/chrome-headless-shell | tail -1)" >> "$GITHUB_ENV"

      - name: Fetch pinned upstream sources
        if: steps.scope.outputs.relevant == 'true'
        run: bash conformance/ci/fetch_sources.sh

      - name: Cache the ucp-schema builds (one per layout — conformance/ci/oracle_manifest.json)
        if: steps.scope.outputs.relevant == 'true'
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            conformance/.vendor/ucp-schema/target
            conformance/.vendor/ucp-schema-0825/target
          key: ucp-schema-${{ runner.os }}-${{ hashFiles('conformance/SOURCES.lock.json', 'conformance/ci/oracle_manifest.json') }}

      - name: Build the ucp-schema oracle (pinned build, 2026-04-08 layout)
        if: steps.scope.outputs.relevant == 'true'
        run: cargo build --release --manifest-path conformance/.vendor/ucp-schema/Cargo.toml

      - name: Build the per-version ucp-schema oracle (merged main b52518f5, 2026-08-25 layout — D4-04, decision 7b)
        if: steps.scope.outputs.relevant == 'true'
        run: cargo build --release --manifest-path conformance/.vendor/ucp-schema-0825/Cargo.toml

      - name: Per-version oracle manifest — builds match their commits and --version fingerprints
        if: steps.scope.outputs.relevant == 'true'
        run: python3 conformance/selfcheck/validate_schema_oracle_manifest.py

      - name: Build the python-sdk venvs for the pydantic third leg (D4-05; tag 0.5.0 gated, main report-only)
        if: steps.scope.outputs.relevant == 'true'
        # network installs (PyPI + git); a failure here makes dual-oracle-0825-pydantic an honest
        # rc 2 skip, never a false green — so continue-on-error is safe for THIS step only.
        run: bash conformance/ci/make_sdk_venvs.sh
        continue-on-error: true

      - name: Install the pinned js-sdk for the zod report-only leg (D4-05)
        if: steps.scope.outputs.relevant == 'true'
        run: cd conformance/ci/zod_feed && npm install --no-audit --no-fund --package-lock=false
        continue-on-error: true

      - name: Bring up the golden server
        if: steps.scope.outputs.relevant == 'true'
        run: |
          bash conformance/ci/serve_golden.sh
        env:
          PORT: "8182"
          SIM_SECRET: selfcheck-secret
          DB_DIR: /tmp/ucp_test

      - name: Bring up the Node.js reference (second differential target)
        if: steps.scope.outputs.relevant == 'true'
        # Best-effort: a SECOND independent implementation (samples/rest/nodejs, a
        # Hono app on @ucp-js/sdk) for the differential/fixture-circularity gate.
        # continue-on-error so an environment hiccup here never reds the whole
        # suite — if the server is not reachable, the differential gate skips this
        # target cleanly (differential.py filters on reachability), exactly like the
        # flower target's env-var gate.
        continue-on-error: true
        run: bash conformance/ci/serve_node_reference.sh
        env:
          NODE_PORT: "3000"
          SIM_SECRET: selfcheck-secret

      - name: Run the conformance self-test suite
        if: steps.scope.outputs.relevant == 'true'
        run: |
          python3 conformance/ci/run_suite.py \
            --server http://localhost:8182 \
            --require-server \
            --battery \
            --verbose
        # With the ucp-schema oracle built above, the schema / fixture / profile_schema
        # gates run for real here (no longer skipped). UCP_NODEJS_URL makes the
        # differential gate also exercise the Node.js reference (a second independent
        # target); if that server is not up, the gate simply omits it — no failure.
        env:
          UCP_NODEJS_URL: http://localhost:3000
          # the run-scoped record dir (merchant run records, the battery's in-run report):
          # fixed so the artifact step below can upload the battery report from it
          RUN_SUITE_RECORD_DIR: ${{ runner.temp }}/run_suite_records

      - name: Reach report drift check (B3 — decision 6 gated, never commits)
        if: steps.scope.outputs.relevant == 'true'
        # Regenerates the differential reach report IN MEMORY against the live targets
        # (:8182 flower, :3000 node) and compares the GRADED statuses per (version:check,
        # target) with the committed conformance/coverage/reach_report.json. Drift = a
        # check's graded status moved on an independent target: the run FAILS and the only
        # fix is an owner commit of the regenerated report (decisions 6/34: live-wire labels
        # are public numbers, never auto-applied; decision 24: no bot commits). Kill-proof:
        # run_suite gate `reach-selftest`. rc 2 (no target reachable) is a failure here too:
        # a drift check that could not run must not read as "0 drift".
        run: python3 conformance/coverage/gen_reach_report.py --check
        env:
          UCP_NODEJS_URL: http://localhost:3000

      - name: "Publish the golden-0825 battery report (R11 in CI — decision 24: an artifact, never a bot commit)"
        # --battery above ran the R11 mutant battery inside this run and wrote THIS run's
        # report to RUN_SUITE_RECORD_DIR (the battery's --out; the tracked LAST_RUN.json is
        # never rewritten by a run — W1 D3 carry-over, the CI-1 class); the owner refreshes
        # the tracked file at release time from this artifact (or `--record` locally).
        if: always() && steps.scope.outputs.relevant == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: golden-0825-battery-LAST_RUN
          path: ${{ runner.temp }}/run_suite_records/battery_LAST_RUN.json
          if-no-files-found: warn

      - name: Tear down the Node.js reference
        if: always() && steps.scope.outputs.relevant == 'true'
        run: bash conformance/ci/stop_node_reference.sh
        env:
          NODE_PORT: "3000"

      - name: Tear down the golden server
        if: always() && steps.scope.outputs.relevant == 'true'
        run: bash conformance/ci/stop_golden.sh
        env:
          DB_DIR: /tmp/ucp_test

      - name: Verify the pip bundle is in sync with source
        if: steps.scope.outputs.relevant == 'true'
        run: |
          bash packaging/sync_bundle.sh
          git diff --exit-code packaging/spck_conformance/_bundle \
            || { echo "::error::packaging bundle is stale — run packaging/sync_bundle.sh and commit"; exit 1; }

      - name: Verify the pip bundle is COMPLETE (every module the runner imports is shipped)
        if: steps.scope.outputs.relevant == 'true'
        # The drift diff above proves copied files are current, never that a needed file
        # is copied (D1-05): this imports the runner from the bundle in an isolated
        # interpreter and diffs the bundle against merchant.py's transitive imports.
        run: python3 packaging/validate_bundle.py

  # D5-06: the composite Action is exercised from ITS OWN CHECKOUT against the golden in
  # the same workflow (the only proof that `uses: vishkaty/ucp-conformance@<ref>` works at
  # <ref>). The `source: pypi` twin is report-only while packaging/pyproject.toml is below
  # 0.4.0 (PyPI 0.3.1 predates the 08-25 register) — decided mechanically by
  # packaging/pypi_job_mode.py, so the exemption expires with the 0.4.0 bump, not by hand.
  # `selftest` stays the single required context (branch protection); this job informs.
  action-selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # NO scope short-circuit in this job, deliberately. It is not a required context,
      # so it can never deadlock a pull request, and it is the ONLY job that exercises
      # `action.yml`. Gating it on the watched-path list would mean an action.yml-only
      # change merges with the composite Action never once executed. Measured on probe
      # runs 266 to 271: this job takes 23 to 29 s in full and 6 s short-circuited, so
      # gating it saved 17 to 23 s on a job that gates nothing, at the price of a 45-line
      # copy of the other job's scope script that had to stay byte-identical by hand.
      # Running it always is the cheaper side of that trade.
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: false

      - name: Fetch pinned upstream sources
        run: bash conformance/ci/fetch_sources.sh

      - name: Bring up the golden server
        run: bash conformance/ci/serve_golden.sh
        env:
          PORT: "8182"
          SIM_SECRET: selfcheck-secret
          DB_DIR: /tmp/ucp_action_test

      - name: Decide whether the PyPI twin is counted (mechanical expiry at 0.4.0)
        id: mode
        run: python3 packaging/pypi_job_mode.py --github-output >> "$GITHUB_OUTPUT"

      - name: Action from its own checkout (source=checkout) — counted
        uses: ./
        with:
          server: http://localhost:8182
          source: checkout
          junit: /tmp/action-checkout.xml

      - name: Action from PyPI (source=pypi) — report-only until pyproject >= 0.4.0
        uses: ./
        continue-on-error: ${{ steps.mode.outputs.mode == 'report-only' }}
        with:
          server: http://localhost:8182
          source: pypi
          junit: /tmp/action-pypi.xml

      - name: Tear down the golden server
        if: always()
        run: bash conformance/ci/stop_golden.sh
        env:
          DB_DIR: /tmp/ucp_action_test
