name: conformance-selftest

# The "test suite for the test suite": on every push/PR, materialize the pinned
# upstream sources, bring up the official golden server, and run every self-validation
# gate (register quote-check, verdict gate, both version suites, the merchant reference
# gate, and mutation kill-rate). Red here means a change broke the suite's soundness.

on:
  push:
    # lane/** and lane-* are the working lane-branch conventions (lane-receiver,
    # lane-fuzz, lane/p0-*, lane/p1-*) — included so lane branches run the selftest
    # BEFORE they merge to main. Without this a red lane can reach main unseen
    # (the 08-04 incident); the paths filter below still applies to all of them.
    branches: [main, "feat/**", "fix/**", "lane/**", "lane-*"]
    # public/** is included because the `coverage` gate cross-checks the published
    # coverage.json and the site's advertised check counts against reality.
    # packaging/** is included because the bundle-drift step + package-agent gate validate it.
    paths: ["conformance/**", "public/**", "tests/**", "functions/**", "packaging/**", ".github/workflows/conformance.yml"]
  pull_request:
    paths: ["conformance/**", "public/**", "tests/**", "functions/**", "packaging/**", ".github/workflows/conformance.yml"]
  workflow_dispatch: {}
  schedule:
    # Weekly heartbeat (Mon 06:17 UTC): sources are pinned, so this catches
    # environmental rot (runner images, toolchains, cache decay) — keeps the
    # "regularly tested and verified" promise even in quiet weeks.
    - cron: "17 6 * * 1"

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: false   # avoid the flaky cache-prune post-step (hangs then errors)

      - name: Set up Rust (for the ucp-schema oracle)
        uses: dtolnay/rust-toolchain@stable

      - name: Install the third-party crypto oracle (for the jws-interop gate)
        run: python3 -m pip install cryptography

      - name: Install the independent schema referee (for the dual-oracle gate)
        # An INDEPENDENT Python jsonschema engine (Draft 2020-12) that cross-checks the
        # Rust ucp-schema oracle on every schema check; verdict divergence alarms. Draft
        # 2020-12 $id resolution needs jsonschema>=4.26 + referencing. If this install
        # fails, the dual-oracle gate auto-skips (exit 2) rather than falsely passing.
        run: python3 -m pip install "jsonschema>=4.26" referencing

      - name: Install the pinned AP2 reference SDK (for the sdjwt-vs-reference gate)
        # google-agentic-commerce/AP2 tracks a moving IETF draft, so we pin the exact
        # commit. The gate's reference-parity tier auto-skips if this install fails;
        # tier 1 (our independent codec on committed goldens) always runs.
        run: python3 -m pip install "git+https://github.com/google-agentic-commerce/AP2@e1ea56db72a6385bce3e5c1112b3a56ce60acb43" || echo "::warning::AP2 reference install failed — sdjwt-vs-reference runs tier 1 only"

      - name: Install web-test deps + headless Chromium (for the web-unit/web-browser gates)
        run: |
          cd tests/web && npm i --no-audit --no-fund
          npx @puppeteer/browsers install chrome-headless-shell@stable --path "$HOME/.cache/puppeteer" | tail -1
          echo "CHROME_PATH=$(ls $HOME/.cache/puppeteer/chrome-headless-shell/*/chrome-headless-shell-linux64/chrome-headless-shell | tail -1)" >> "$GITHUB_ENV"

      - name: Fetch pinned upstream sources
        run: bash conformance/ci/fetch_sources.sh

      - name: Cache the ucp-schema build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            conformance/.vendor/ucp-schema/target
          key: ucp-schema-${{ runner.os }}-${{ hashFiles('conformance/SOURCES.lock.json') }}

      - name: Build the ucp-schema oracle
        run: cargo build --release --manifest-path conformance/.vendor/ucp-schema/Cargo.toml

      - name: Bring up the golden server
        run: |
          bash conformance/ci/serve_golden.sh
        env:
          PORT: "8182"
          SIM_SECRET: selfcheck-secret
          DB_DIR: /tmp/ucp_test

      - name: Bring up the Node.js reference (second differential target)
        # Best-effort: a SECOND independent implementation (samples/rest/nodejs, a
        # Hono app on @ucp-js/sdk) for the differential/fixture-circularity gate.
        # continue-on-error so an environment hiccup here never reds the whole
        # suite — if the server is not reachable, the differential gate skips this
        # target cleanly (differential.py filters on reachability), exactly like the
        # flower target's env-var gate.
        continue-on-error: true
        run: bash conformance/ci/serve_node_reference.sh
        env:
          NODE_PORT: "3000"
          SIM_SECRET: selfcheck-secret

      - name: Run the conformance self-test suite
        run: |
          python3 conformance/ci/run_suite.py \
            --server http://localhost:8182 \
            --require-server \
            --battery \
            --verbose
        # With the ucp-schema oracle built above, the schema / fixture / profile_schema
        # gates run for real here (no longer skipped). UCP_NODEJS_URL makes the
        # differential gate also exercise the Node.js reference (a second independent
        # target); if that server is not up, the gate simply omits it — no failure.
        env:
          UCP_NODEJS_URL: http://localhost:3000
          # the run-scoped record dir (merchant run records, the battery's in-run report):
          # fixed so the artifact step below can upload the battery report from it
          RUN_SUITE_RECORD_DIR: ${{ runner.temp }}/run_suite_records

      - name: Reach report drift check (B3 — decision 6 gated, never commits)
        # Regenerates the differential reach report IN MEMORY against the live targets
        # (:8182 flower, :3000 node) and compares the GRADED statuses per (version:check,
        # target) with the committed conformance/coverage/reach_report.json. Drift = a
        # check's graded status moved on an independent target: the run FAILS and the only
        # fix is an owner commit of the regenerated report (decisions 6/34: live-wire labels
        # are public numbers, never auto-applied; decision 24: no bot commits). Kill-proof:
        # run_suite gate `reach-selftest`. rc 2 (no target reachable) is a failure here too:
        # a drift check that could not run must not read as "0 drift".
        run: python3 conformance/coverage/gen_reach_report.py --check
        env:
          UCP_NODEJS_URL: http://localhost:3000

      - name: "Publish the golden-0825 battery report (R11 in CI — decision 24: an artifact, never a bot commit)"
        # --battery above ran the R11 mutant battery inside this run and wrote THIS run's
        # report to RUN_SUITE_RECORD_DIR (the battery's --out; the tracked LAST_RUN.json is
        # never rewritten by a run — W1 D3 carry-over, the CI-1 class); the owner refreshes
        # the tracked file at release time from this artifact (or `--record` locally).
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-0825-battery-LAST_RUN
          path: ${{ runner.temp }}/run_suite_records/battery_LAST_RUN.json
          if-no-files-found: warn

      - name: Tear down the Node.js reference
        if: always()
        run: bash conformance/ci/stop_node_reference.sh
        env:
          NODE_PORT: "3000"

      - name: Tear down the golden server
        if: always()
        run: bash conformance/ci/stop_golden.sh
        env:
          DB_DIR: /tmp/ucp_test

      - name: Verify the pip bundle is in sync with source
        run: |
          bash packaging/sync_bundle.sh
          git diff --exit-code packaging/spck_conformance/_bundle \
            || { echo "::error::packaging bundle is stale — run packaging/sync_bundle.sh and commit"; exit 1; }

      - name: Verify the pip bundle is COMPLETE (every module the runner imports is shipped)
        # The drift diff above proves copied files are current, never that a needed file
        # is copied (D1-05): this imports the runner from the bundle in an isolated
        # interpreter and diffs the bundle against merchant.py's transitive imports.
        run: python3 packaging/validate_bundle.py

  # D5-06: the composite Action is exercised from ITS OWN CHECKOUT against the golden in
  # the same workflow (the only proof that `uses: vishkaty/ucp-conformance@<ref>` works at
  # <ref>). The `source: pypi` twin is report-only while packaging/pyproject.toml is below
  # 0.4.0 (PyPI 0.3.1 predates the 08-25 register) — decided mechanically by
  # packaging/pypi_job_mode.py, so the exemption expires with the 0.4.0 bump, not by hand.
  # `selftest` stays the single required context (branch protection); this job informs.
  action-selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: false

      - name: Fetch pinned upstream sources
        run: bash conformance/ci/fetch_sources.sh

      - name: Bring up the golden server
        run: bash conformance/ci/serve_golden.sh
        env:
          PORT: "8182"
          SIM_SECRET: selfcheck-secret
          DB_DIR: /tmp/ucp_action_test

      - name: Decide whether the PyPI twin is counted (mechanical expiry at 0.4.0)
        id: mode
        run: python3 packaging/pypi_job_mode.py --github-output >> "$GITHUB_OUTPUT"

      - name: Action from its own checkout (source=checkout) — counted
        uses: ./
        with:
          server: http://localhost:8182
          source: checkout
          junit: /tmp/action-checkout.xml

      - name: Action from PyPI (source=pypi) — report-only until pyproject >= 0.4.0
        uses: ./
        continue-on-error: ${{ steps.mode.outputs.mode == 'report-only' }}
        with:
          server: http://localhost:8182
          source: pypi
          junit: /tmp/action-pypi.xml

      - name: Tear down the golden server
        if: always()
        run: bash conformance/ci/stop_golden.sh
        env:
          DB_DIR: /tmp/ucp_action_test
