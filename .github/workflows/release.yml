name: release

# Publish spck-conformance to PyPI when a version tag is pushed — via PyPI Trusted
# Publishing (OIDC), so NO API token is stored anywhere. Release flow:
#   1. bump the version in packaging/pyproject.toml, commit
#   2. git tag v<version>   (must match pyproject version — guarded below)
#   3. git push --tags  ->  this workflow builds + publishes.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write        # required for PyPI Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0          # the ancestor-of-main guard needs history (D5-15)

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Guards — tag shape (vX.Y.Z or vX.Y.ZrcN), tag == pyproject == __version__, rc before final, CHANGELOG entry, wheel bundles every spec version
        # packaging/release_guards.sh — the same script preflight runs; kill-tested by
        # packaging/test_preflight_guards.sh + test_release_guards.sh. Pre-release tags
        # (PEP 440 rcN) are accepted; a FINAL tag is refused until packaging/CHANGELOG.md
        # records a green rc acceptance (decision 17: 0.4.0rc1 first, then 0.4.0).
        run: bash packaging/release_guards.sh "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_GUARDS_REQUIRE_CI: "1"   # the tagged SHA's `selftest` check-run must be success (D5-15)

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build --outdir dist packaging

      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
