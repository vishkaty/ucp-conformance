name: "UCP Conformance (unofficial)"
description: "Capability-scoped UCP conformance check for a server. Fails CI on MUST deviations and uploads a JUnit report. Independent, not affiliated with the official UCP project."
branding:
  icon: "check-circle"
  color: "blue"

inputs:
  server:
    description: "Base URL of the UCP server to check (e.g. https://api.example.com)"
    required: true
  config:
    description: "Path to a merchant config JSON (unlocks data-dependent checks). Optional."
    required: false
    default: ""
  junit:
    description: "Path to write the JUnit XML report."
    required: false
    default: "ucp-conformance.xml"
  python-version:
    description: "Python version to use."
    required: false
    default: "3.12"
  fail-on-deviation:
    description: "Fail the job if any MUST deviates (default true). Set false to report-only."
    required: false
    default: "true"
  source:
    description: "Where the runner comes from: `checkout` (default — the engine at the ref you `uses:`, so @vX.Y.Z and @main track this repo) or `pypi` (the published spck-conformance release)."
    required: false
    default: "checkout"

runs:
  using: "composite"
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "${{ inputs.python-version }}"
    - name: Install spck-conformance
      shell: bash
      # source=checkout installs the package from THIS action's checkout (decision 28/17):
      # `uses: vishkaty/ucp-conformance@v0.4.0` runs exactly the engine tagged v0.4.0, and
      # @main tracks main — never a PyPI release that lags the register. source=pypi keeps
      # the published wheel (report-only in our own CI until pyproject >= 0.4.0, D5-06).
      run: |
        if [ "${{ inputs.source }}" = "pypi" ]; then
          pip install spck-conformance
        else
          pip install "${{ github.action_path }}/packaging"
        fi
    - name: Run UCP conformance
      shell: bash
      run: |
        set -o pipefail
        args=(--server "${{ inputs.server }}" --junit "${{ inputs.junit }}")
        if [ -n "${{ inputs.config }}" ]; then args+=(--config "${{ inputs.config }}"); fi
        spck-conformance "${args[@]}"; rc=$?
        echo "spck-conformance exit code: $rc"
        if [ "${{ inputs.fail-on-deviation }}" != "true" ]; then exit 0; fi
        exit $rc
