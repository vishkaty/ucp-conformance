[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "spck-conformance"
version = "0.4.0"
description = "Unofficial, capability-adaptive conformance runner for the Universal Commerce Protocol (UCP)"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "spck.dev"}]
keywords = ["ucp", "universal-commerce-protocol", "conformance", "agentic-commerce"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
]
# certifi provides a CA bundle so TLS verification works on Pythons that ship none
# (common on macOS python.org builds). Everything else is stdlib.
dependencies = ["certifi>=2023.7.22"]

[project.urls]
Homepage = "https://spck.dev"
Source = "https://github.com/vishkaty/ucp-conformance"

[project.scripts]
spck-conformance = "spck_conformance.cli:main"

[tool.setuptools]
packages = ["spck_conformance"]

[tool.setuptools.package-data]
spck_conformance = [
  "_bundle/conformance/checks/*.py",
  "_bundle/conformance/selfcheck/*.py",
  "_bundle/conformance/requirements/*/*.json",
  "_bundle/conformance/agent/*.py",
  "_bundle/conformance/agent/*.json",
  "_bundle/conformance/common/*.py",
  # Subdirectories the flat globs above do not reach. Each is filled deliberately by
  # packaging/sync_bundle.sh; without a glob here the wheel drops it silently and the
  # installed CLI dies on ImportError while every local gate stays green (W1: the Action's
  # own-checkout job on `seq_invariants`). packaging/test_wheel_completeness.py pins
  # bundle == wheel so this list can never fall behind the cp list again.
  "_bundle/conformance/ci/*.py",
  "_bundle/conformance/testbed/*.py",
  "_bundle/conformance/agent/fixtures_08_25/*.json",
]
